<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Glow -->
  <path d="M 256 60 L 410 130 C 410 290 256 420 256 450 C 256 420 102 290 102 130 Z" 
        fill="#18181b" 
        stroke="url(#shieldBorder)" 
        stroke-width="12" 
        stroke-linejoin="round"/>

  <!-- Inner Scale of Justice -->
  <!-- Beam -->
  <line x1="160" y1="210" x2="352" y2="210" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Center Column -->
  <line x1="256" y1="140" x2="256" y2="340" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Top Finial -->
  <circle cx="256" cy="140" r="16" fill="url(#goldGrad)"/>
  <!-- Base -->
  <path d="M 200 350 L 312 350 L 290 330 L 222 330 Z" fill="url(#goldGrad)"/>

  <!-- Left Scale Pan -->
  <line x1="180" y1="210" x2="150" y2="280" stroke="#fde047" stroke-width="6"/>
  <line x1="180" y1="210" x2="210" y2="280" stroke="#fde047" stroke-width="6"/>
  <path d="M 140 280 Q 180 310 220 280 Z" fill="url(#goldGrad)"/>

  <!-- Right Scale Pan -->
  <line x1="332" y1="210" x2="302" y2="280" stroke="#fde047" stroke-width="6"/>
  <line x1="332" y1="210" x2="362" y2="280" stroke="#fde047" stroke-width="6"/>
  <path d="M 292 280 Q 332 310 372 280 Z" fill="url(#goldGrad)"/>

  <!-- Lightning / Radar Pulse Motif -->
  <path d="M 256 220 L 245 260 L 265 260 L 248 300 L 272 250 L 252 250 Z" fill="#ffffff" opacity="0.9"/>
</svg>
